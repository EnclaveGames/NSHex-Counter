name: Redeploy nshex.enclavegames.com

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger site deploy
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.NSHEX_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/EnclaveGames/NSHex/dispatches \
            -d '{"event_type":"counter-updated"}'
