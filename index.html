<body>
<script src="src/start.js"></script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){
	var controlled = !!navigator.serviceWorker.controller;
	navigator.serviceWorker.register('sw.js').catch(function(){});
	// the first install also takes control of the page; only a later change means a new version arrived
	navigator.serviceWorker.addEventListener('controllerchange',function(){
		if(!controlled){ controlled = true; return; }
		var pl = (navigator.language||'').slice(0,2) === 'pl';
		var bar = document.createElement('div');
		bar.textContent = pl ? 'Dostępna nowa wersja - dotknij, aby odświeżyć' : 'New version available - tap to reload';
		bar.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:90%;padding:10px 18px;background:#000;color:#fff;border:2px solid #ffde00;border-radius:24px;font:16px sans-serif;text-align:center;cursor:pointer;z-index:10';
		bar.onclick = function(){ location.reload(); };
		document.body.appendChild(bar);
	});
});}
</script>
</body>
</html>
